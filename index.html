:root{--paper:#EEF1F5;--ink:#1B2A41;--muted:#5B6B82;--line:#C9D1DC;--card:#fff;--thought:#6C4AB6;--action:#0E8C7F;--obs:#B87A00;
--font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);display:grid;grid-template-columns:290px 1fr;min-height:100vh}
nav{background:#E2E7EE;border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}

nav .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
nav a.slides-link{display:block;text-align:center;font-weight:700;background:var(--action);color:#fff;padding:8px;border-radius:5px;margin-bottom:12px}
nav a.slides-link:hover{background:#0B7469}
nav input{width:100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:5px;margin-bottom:14px;background:#fff}
nav h4{font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:700}
nav a{display:block;font-size:14px;color:var(--ink);text-decoration:none;padding:4px 8px;border-radius:4px;line-height:1.45}
nav a:hover{background:#D3DAE4}
nav a.on{background:var(--ink);color:#fff}
main{padding:44px 56px 80px;max-width:900px}
.path{font-size:13px;color:var(--muted)}
h1.ptitle{font-size:34px;margin:6px 0 6px;line-height:1.25}
.meta{font-size:14px;color:var(--muted);margin-bottom:22px;line-height:1.6}
article{font-size:17px;line-height:1.8}
article h1{display:none}
article h2{font-size:23px;margin:30px 0 10px}
article h3{font-size:19px;margin:22px 0 8px}
article table{border-collapse:collapse;width:100%;margin:12px 0;font-size:15.5px;background:var(--card)}
article th,article td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;line-height:1.6}
article th{background:#E6EBF1}
article pre{background:var(--card);border:1px solid var(--line);padding:12px 14px;border-radius:5px;overflow:auto;font-size:14px;line-height:1.55}
article code{font-size:.92em}
article blockquote{margin:12px 0;padding:6px 16px;border-left:4px solid var(--line);color:var(--muted)}
a.wl{color:var(--action);font-weight:700;text-decoration:none;border-bottom:1px solid currentColor}
a.cite{font-size:12px;font-weight:700;color:#fff;background:var(--thought);padding:1px 6px;border-radius:3px;text-decoration:none;margin-left:2px;vertical-align:1px}
.note-tag{font-size:12px;font-weight:700;color:#fff;background:var(--obs);padding:1px 6px;border-radius:3px;margin-left:2px;vertical-align:1px}
.intro{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 20px;margin-bottom:20px}
.raw-note{color:var(--muted);font-size:15px}
.back{margin-top:36px;font-size:14px;color:var(--muted)}
.back a{color:var(--muted)}
.links{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
a:focus-visible,input:focus-visible{outline:3px solid var(--thought);outline-offset:2px}

<script>
const PAGES={"agent-definitions-compared": {"title": "比較｜三個來源怎麼定義 agent", "meta": "類型：comparison｜來源：[01, 04, 05]｜更新：2026-11-15", "html": "<h1>「Agent」的定義比較</h1>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Anthropic</th>\n<th>OpenAI</th>\n<th>Hugging Face</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>核心判準</td>\n<td>LLM 動態決定自己的流程與工具<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>LLM 掌控工作流程的執行，並使用工具<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n<td>用 AI 模型和環境互動以達成目標<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n<tr>\n<td>有預設流程的系統</td>\n<td>叫 workflow，不算 agent<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>沒讓 LLM 控制流程就不是 agent<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n<td>屬於光譜的低階（router ★☆☆）<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n<tr>\n<td>定義形式</td>\n<td>二分法（workflow / agent）<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>二分法（是 / 不是）<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n<td>連續光譜<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n</tbody>\n</table>\n<h2>共識</h2>\n<ul>\n<li>三者都同意：關鍵在於 <strong>LLM 對流程的控制程度</strong>，以及<strong>能不能透過工具和環境互動</strong>。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a><a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n</ul>\n<h2>差異</h2>\n<ul>\n<li>「routing 算不算 agent」三方說法不同：Anthropic 歸為 workflow，HF 給一顆星。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a><a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>本 Wiki 不替來源選邊；教學時建議用「光譜」的角度呈現，再說明 Anthropic 的界線畫在哪裡。<span class=\"note-tag\" title=\"本 Wiki 自己加的說明，不是來源原文\">註解</span></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a>、<a class=\"wl\" href=\"#workflow-vs-agent\">workflow-vs-agent</a>、<a class=\"wl\" href=\"#agency-spectrum\">agency-spectrum</a>、<a class=\"wl\" href=\"#source-discrepancies\">source-discrepancies</a></p>", "path": "wiki/comparisons/agent-definitions-compared.md"}, "source-discrepancies": {"title": "來源差異與時效紀錄", "meta": "類型：comparison｜來源：[01, 02, 03, 05]｜更新：2026-11-15", "html": "<h1>來源差異與時效紀錄（lint 人工檢查用）</h1>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>項目</th>\n<th>說法 A</th>\n<th>說法 B</th>\n<th>處理方式</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>ReAct 年份</td>\n<td>Weng：Yao et al. 2023<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></td>\n<td>arXiv v1：2022-10-06，v3：2023-03（ICLR）<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></td>\n<td>簡報寫「2022 年提出」<span class=\"note-tag\" title=\"本 Wiki 自己加的說明，不是來源原文\">註解</span></td>\n</tr>\n<tr>\n<td>2</td>\n<td>Agent 的界線</td>\n<td>Anthropic：routing 是 workflow<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>HF：router 算 ★☆☆<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n<td>見 <a class=\"wl\" href=\"#agent-definitions-compared\">agent-definitions-compared</a></td>\n</tr>\n<tr>\n<td>3</td>\n<td>時效</td>\n<td>Anthropic 文章的編者註說部分工具描述已過時<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>—</td>\n<td>簡報不放框架和模型名稱<span class=\"note-tag\" title=\"本 Wiki 自己加的說明，不是來源原文\">註解</span></td>\n</tr>\n</tbody>\n</table>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#agent-definitions-compared\">agent-definitions-compared</a></p>", "path": "wiki/comparisons/source-discrepancies.md"}, "agency-spectrum": {"title": "Agency 光譜：從處理器到多代理", "meta": "類型：concept｜來源：[01, 05]｜更新：2026-11-15", "html": "<h1>Agency 光譜</h1>\n<p>Agency（能動性）不是有或沒有，而是一個連續的光譜；這張表出自 smolagents 的概念指南。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></p>\n<table>\n<thead>\n<tr>\n<th>等級</th>\n<th>名稱</th>\n<th>LLM 的輸出決定了什麼</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>☆☆☆</td>\n<td>Simple processor</td>\n<td>不影響程式流程<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n<tr>\n<td>★☆☆</td>\n<td>Router</td>\n<td>決定走哪一條基本控制路徑<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n<tr>\n<td>★★☆</td>\n<td>Tool caller</td>\n<td>決定執行哪個函式、帶什麼參數<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n<tr>\n<td>★★★</td>\n<td>Multi-step agent</td>\n<td>決定要不要繼續迭代、何時停止<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n<tr>\n<td>★★★</td>\n<td>Multi-agent</td>\n<td>一個 agentic workflow 可以啟動另一個<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>原頁面給最後兩級相同的星數。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>判斷方式：看 <strong>LLM 的輸出能控制程式流程到什麼程度</strong>。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n</ul>\n<h2>⚠️ 來源差異</h2>\n<ul>\n<li>依照這張表，router 也算一星；但 Anthropic 把 routing 歸類為 workflow，不算 agent。→ <a class=\"wl\" href=\"#agent-definitions-compared\">agent-definitions-compared</a><a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a><a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a>、<a class=\"wl\" href=\"#workflow-vs-agent\">workflow-vs-agent</a>、<a class=\"wl\" href=\"#multi-agent-orchestration\">multi-agent-orchestration</a></p>", "path": "wiki/concepts/agency-spectrum.md"}, "agent-challenges": {"title": "Agent 的挑戰與風險", "meta": "類型：concept｜來源：[01, 02]｜更新：2026-11-15", "html": "<h1>Agent 的挑戰與風險</h1>\n<h2>Weng 列出的三大挑戰</h2>\n<ol>\n<li><strong>Context 長度有限</strong>：歷史紀錄、指令、API 說明都要塞進有限的 context。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li><strong>長期規劃困難</strong>：遇到意外錯誤時難以調整計畫。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li><strong>自然語言介面不可靠</strong>：輸出可能格式錯誤或不照指示，所以 agent 程式裡有很多都在處理輸出解析。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n</ol>\n<h2>Anthropic 提醒的風險</h2>\n<ul>\n<li>成本較高，而且錯誤會一步步累積（compounding errors）。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>建議在沙盒環境中大量測試，並加上適當的 guardrails。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n</ul>\n<h2>模型自評不可靠</h2>\n<ul>\n<li>ChemCrow 案例：用 LLM 評分時它和 GPT-4 差不多，但化學專家明顯偏好 ChemCrow，代表在專業領域 LLM 不一定能正確評估自己的表現。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#guardrails-and-oversight\">guardrails-and-oversight</a>、<a class=\"wl\" href=\"#planning\">planning</a>、<a class=\"wl\" href=\"#memory\">memory</a></p>", "path": "wiki/concepts/agent-challenges.md"}, "agent-loop": {"title": "Agent Loop：Thought → Action → Observation", "meta": "類型：concept｜來源：[01, 02, 03, 04, 05]｜更新：2026-11-15", "html": "<h1>Agent Loop</h1>\n<h2>核心循環</h2>\n<ul>\n<li>ReAct 把推理和行動交錯進行：Thought（想）→ Action（做）→ Observation（看結果），然後重複。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a><a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></li>\n<li>Hugging Face 課程也把 agent 的工作流程描述成 Thought → Action → Observation。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>Anthropic：agent 的實作常常只是「LLM 根據環境回饋使用工具，然後不斷循環」。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>每一步都要從環境取得「ground truth」（工具結果、程式執行結果）來判斷進度。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n</ul>\n<h2>迴圈什麼時候停？（OpenAI 的 run loop 結束條件）</h2>\n<ul>\n<li>呼叫了「最終輸出」工具<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>模型回應時沒有呼叫任何工具<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>發生錯誤<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>達到最大回合數<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>Anthropic 也建議設停止條件，例如最大迭代次數，並在檢查點或卡住時暫停、請人類回饋。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n</ul>\n<h2>為什麼要交錯，而不是先全部想完？</h2>\n<ul>\n<li>只推理容易產生幻覺和錯誤傳遞；接上外部工具取得資訊後，問題就減少了。<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></li>\n<li>推理軌跡讓人看得懂 agent 在做什麼，比較容易信任和除錯。<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></li>\n</ul>\n<h2>示意</h2>\n<pre><code>Thought: 我需要知道 X 的出生年\nAction: search(&quot;X&quot;)\nObservation: X 生於 1990 年……\nThought: 有答案了\nAction: finish(&quot;1990&quot;)\n</code></pre>\n<blockquote>\n<p>上面的範例是本 Wiki 為了教學自己寫的，格式依照 ReAct 的 Thought / Action / Observation。</p>\n</blockquote>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#planning\">planning</a>、<a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a>、<a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a>、<a class=\"wl\" href=\"#guardrails-and-oversight\">guardrails-and-oversight</a></p>", "path": "wiki/concepts/agent-loop.md"}, "augmented-llm": {"title": "Augmented LLM（增強型 LLM）", "meta": "類型：concept｜來源：[01, 06]｜更新：2026-11-15", "html": "<h1>Augmented LLM</h1>\n<ul>\n<li>所有 agentic system 的基本積木：<strong>LLM + 檢索（retrieval）+ 工具（tools）+ 記憶（memory）</strong>。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>現在的模型可以自己產生搜尋查詢、挑選工具、決定要記住什麼。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>重點是依照用途調整這些能力，並給 LLM 一個清楚、有文件的介面。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>MCP 是實作這些擴充的一種方式，可以接上第三方工具生態系。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a><a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a>、<a class=\"wl\" href=\"#memory\">memory</a>、<a class=\"wl\" href=\"#mcp\">mcp</a>、<a class=\"wl\" href=\"#workflow-patterns\">workflow-patterns</a></p>", "path": "wiki/concepts/augmented-llm.md"}, "guardrails-and-oversight": {"title": "Guardrails 與人類監督", "meta": "類型：concept｜來源：[01, 04]｜更新：2026-11-15", "html": "<h1>Guardrails 與人類監督</h1>\n<h2>分層防護</h2>\n<ul>\n<li>單一 guardrail 不夠，要組合多層（LLM 檢查、regex 規則、moderation API）。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>Guardrails 用來補強身分驗證、權限控管等一般資安措施，不是取代它們。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>類型</th>\n<th>作用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Relevance classifier</td>\n<td>擋掉離題的請求<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n<tr>\n<td>Safety classifier</td>\n<td>偵測 jailbreak、prompt injection<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n<tr>\n<td>PII filter</td>\n<td>檢查輸出有沒有個資<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n<tr>\n<td>Moderation</td>\n<td>標記仇恨、騷擾、暴力內容<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n<tr>\n<td>Tool safeguards</td>\n<td>依唯讀或可寫、可不可逆、權限、金額影響，把工具分成低／中／高風險<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n<tr>\n<td>Rules-based</td>\n<td>黑名單、輸入長度限制、regex<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n<tr>\n<td>Output validation</td>\n<td>確保輸出符合品牌價值<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n</tbody>\n</table>\n<h2>什麼時候要交給人類</h2>\n<ul>\n<li><strong>失敗次數超過門檻</strong>：例如多次重試仍無法理解使用者意圖。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li><strong>高風險動作</strong>：取消訂單、大額退款、付款等，在 agent 證明可靠之前都應該由人類把關。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>Anthropic：agent 可以在檢查點或卡住時暫停、請人類回饋；並建議在沙盒中大量測試。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n</ul>\n<h2>建立順序</h2>\n<ul>\n<li>先處理資料隱私和內容安全 → 遇到真實的邊界案例再補 → 在安全與使用體驗之間取得平衡。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#agent-challenges\">agent-challenges</a>、<a class=\"wl\" href=\"#agent-loop\">agent-loop</a>、<a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a></p>", "path": "wiki/concepts/guardrails-and-oversight.md"}, "mcp": {"title": "MCP（Model Context Protocol）", "meta": "類型：concept｜來源：[01, 06]｜更新：2026-11-15", "html": "<h1>MCP：給 agent 用的標準工具接口</h1>\n<h2>要解決的問題</h2>\n<ul>\n<li>每接一個新資料源都要寫一套客製整合，系統很難擴大。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></li>\n<li>MCP 用一個通用、開放的標準取代這些零散的整合。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></li>\n<li>常見比喻：像 AI 應用的 USB-C 接口。<span class=\"note-tag\" title=\"本 Wiki 自己加的說明，不是來源原文\">註解</span>（這個比喻出自官方文件與二手文章，不是發表文原文；見 raw/06 的備註）</li>\n</ul>\n<h2>架構</h2>\n<table>\n<thead>\n<tr>\n<th>角色</th>\n<th>是什麼</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>MCP server</td>\n<td>把資料或工具透過協定公開出來（例如 GitHub、Slack、Postgres）<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></td>\n</tr>\n<tr>\n<td>MCP client</td>\n<td>連接 server 的 AI 應用<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>連線是安全、雙向的。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></li>\n</ul>\n<h2>和 agent 的關係</h2>\n<ul>\n<li>Anthropic 把 MCP 列為實作 augmented LLM（檢索、工具、記憶）的一種方式。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a> → <a class=\"wl\" href=\"#augmented-llm\">augmented-llm</a></li>\n<li>願景：AI 在不同工具和資料集之間移動時，能保有脈絡。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a>、<a class=\"wl\" href=\"#augmented-llm\">augmented-llm</a></p>", "path": "wiki/concepts/mcp.md"}, "memory": {"title": "記憶（Memory）", "meta": "類型：concept｜來源：[02]｜更新：2026-11-15", "html": "<h1>Agent 的記憶</h1>\n<table>\n<thead>\n<tr>\n<th>人類記憶</th>\n<th>Agent 的對應</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>感官記憶（幾秒）</td>\n<td>原始輸入的 embedding 表示<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></td>\n</tr>\n<tr>\n<td>短期／工作記憶（約 7 項、20–30 秒）</td>\n<td>in-context learning，受 context window 長度限制<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></td>\n</tr>\n<tr>\n<td>長期記憶（情節、語意、程序性）</td>\n<td>外部向量資料庫，需要時再檢索<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>長期記憶通常存成 embedding，再用最大內積搜尋（MIPS）的近似最近鄰演算法快速查找，例如 LSH、HNSW、FAISS、ScaNN。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li>Generative Agents 的記憶流：用「新近程度、重要性、相關性」三個分數來檢索記憶。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a>、<a class=\"wl\" href=\"#augmented-llm\">augmented-llm</a>、<a class=\"wl\" href=\"#agent-challenges\">agent-challenges</a></p>", "path": "wiki/concepts/memory.md"}, "multi-agent-orchestration": {"title": "多代理編排（Multi-agent Orchestration）", "meta": "類型：concept｜來源：[01, 04]｜更新：2026-11-15", "html": "<h1>多代理編排</h1>\n<h2>先從單一 agent 開始</h2>\n<ul>\n<li>OpenAI 建議先用單一 agent，逐步加工具，不要一開始就上複雜架構。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>該拆成多個 agent 的兩個訊號：邏輯太複雜（很多巢狀條件）、工具太多又彼此相似。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>重點是工具「相似、重疊」，不是數量：有的系統能處理 15 個以上不同的工具，有的不到 10 個重疊工具就出錯；先改善工具名稱和描述，真的不行再拆。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n</ul>\n<h2>兩種模式（把系統看成 graph：agent 是節點）</h2>\n<table>\n<thead>\n<tr>\n<th>模式</th>\n<th>邊（edge）是什麼</th>\n<th>特色</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Manager</td>\n<td>工具呼叫<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n<td>中央 manager 分派任務給專門 agent 再彙整，自己保有主控權和與使用者的互動<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n<td>翻譯成西、法、義三種語言，各交給一個 agent<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n<tr>\n<td>Decentralized</td>\n<td>Handoff（交棒）<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n<td>單向轉交控制權和對話狀態，沒有中央彙整<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n<td>分流 agent 把訂單問題交給訂單管理 agent<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>Manager pattern 很像 Anthropic 的 orchestrator-workers：中央 LLM 動態拆解任務、分派、彙整。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a> → <a class=\"wl\" href=\"#workflow-patterns\">workflow-patterns</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#workflow-patterns\">workflow-patterns</a>、<a class=\"wl\" href=\"#agency-spectrum\">agency-spectrum</a></p>", "path": "wiki/concepts/multi-agent-orchestration.md"}, "planning": {"title": "規劃（Planning）與自我反思", "meta": "類型：concept｜來源：[02]｜更新：2026-11-15", "html": "<h1>規劃與自我反思</h1>\n<h2>任務拆解</h2>\n<ul>\n<li><strong>Chain of Thought</strong>：讓模型「一步一步想」，把難題拆成簡單步驟，同時讓推理過程看得見。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li><strong>Tree of Thoughts</strong>：每一步產生多個想法，形成一棵樹，再用 BFS/DFS 搜尋。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li>拆解的方式有三種：簡單的 prompt（例如 \"Steps for XYZ\"）、針對任務的指示、人類輸入。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li><strong>LLM+P</strong>：把長期規劃交給外部的傳統規劃器（PDDL），LLM 負責翻譯問題與結果。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n</ul>\n<h2>自我反思</h2>\n<ul>\n<li><strong>ReAct</strong>：交錯進行推理和行動，格式是 Thought / Action / Observation → <a class=\"wl\" href=\"#agent-loop\">agent-loop</a><a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li><strong>Reflexion</strong>：偵測兩種失敗——軌跡很長卻沒成功（規劃沒效率）、連續重複同一動作得到同樣結果（幻覺）；反思內容最多保留 3 條在工作記憶中。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li>在 AlfWorld 上，幻覺比規劃沒效率更常見。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n</ul>\n<h2>限制</h2>\n<ul>\n<li>LLM 遇到意外錯誤時很難調整計畫，不如人類從試錯中學習那麼穩健。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a> → <a class=\"wl\" href=\"#agent-challenges\">agent-challenges</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a>、<a class=\"wl\" href=\"#agent-loop\">agent-loop</a></p>", "path": "wiki/concepts/planning.md"}, "tools-and-aci": {"title": "工具與 ACI（Agent-Computer Interface）", "meta": "類型：concept｜來源：[01, 02, 04, 05]｜更新：2026-11-15", "html": "<h1>工具與 ACI</h1>\n<h2>為什麼需要工具</h2>\n<ul>\n<li>LLM 本身只能產生文字；聊天介面能做出圖片，是因為開發者加了工具讓模型呼叫。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>模型負責產生「工具呼叫」，周圍的程式負責真正執行。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>工具讓 agent 取得模型權重裡沒有的資訊，例如即時資料、程式執行、私有資料。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n</ul>\n<h2>工具的三種類型（OpenAI）</h2>\n<ul>\n<li><strong>Data</strong>：取得脈絡，例如查資料庫、讀 PDF、網路搜尋。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li><strong>Action</strong>：改變外部系統，例如寄信、更新紀錄。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li><strong>Orchestration</strong>：把其他 agent 當成工具來用。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n</ul>\n<h2>ACI：替模型設計介面</h2>\n<ul>\n<li>工具定義值得投入和主 prompt 一樣多的 prompt engineering。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>站在模型的角度想：只看描述和參數，能不能一看就懂怎麼用？要附範例、邊界情況、輸入格式。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li><strong>Poka-yoke（防呆）</strong>：修改參數設計，讓模型比較難犯錯。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>實例：模型離開根目錄後常用錯相對路徑，改成強制使用絕對路徑後就不再出錯。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>工具的關鍵不只是「有」，還要知道何時、如何使用（MRKL 的教訓）。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li>一個 action 不等於一個 tool，一個 action 可能會用到好幾個工具。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#augmented-llm\">augmented-llm</a>、<a class=\"wl\" href=\"#mcp\">mcp</a>、<a class=\"wl\" href=\"#agent-loop\">agent-loop</a>、<a class=\"wl\" href=\"#guardrails-and-oversight\">guardrails-and-oversight</a></p>", "path": "wiki/concepts/tools-and-aci.md"}, "what-is-an-agent": {"title": "什麼是 AI Agent？", "meta": "類型：concept｜來源：[02, 04, 05]｜更新：2026-11-15", "html": "<h1>什麼是 AI Agent？</h1>\n<h2>三種說法</h2>\n<ul>\n<li><strong>Hugging Face</strong>：利用 AI 模型和環境互動，達成使用者設定目標的系統；結合推理、規劃和行動（常透過外部工具）。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li><strong>OpenAI</strong>：「代替你獨立完成任務的系統」；由 LLM 掌控工作流程的執行，並且會使用工具。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li><strong>Lilian Weng</strong>：以 LLM 為大腦，搭配規劃、記憶、工具使用三個元件。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n</ul>\n<h2>拆解成元件</h2>\n<table>\n<thead>\n<tr>\n<th>元件</th>\n<th>角色</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>大腦：LLM</td>\n<td>推理、規劃、決定下一步<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a><a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n<tr>\n<td>規劃 Planning</td>\n<td>拆解子目標、反思與修正<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></td>\n</tr>\n<tr>\n<td>記憶 Memory</td>\n<td>短期記憶 = context 內的資訊；長期記憶 = 外部向量資料庫<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></td>\n</tr>\n<tr>\n<td>工具 Tools（身體）</td>\n<td>能做什麼，取決於被給了哪些工具<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></td>\n</tr>\n<tr>\n<td>指令 Instructions</td>\n<td>明確的行為準則與 guardrails<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></td>\n</tr>\n</tbody>\n</table>\n<h2>Alfred 煮咖啡</h2>\n<ul>\n<li>管家 Alfred 聽到「我想要一杯咖啡」→ 理解語言 → 規劃步驟 → 使用咖啡機（工具）→ 送上咖啡。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n</ul>\n<h2>什麼「不是」agent</h2>\n<ul>\n<li>沒有讓 LLM 掌控流程的應用，例如簡單的 chatbot、單輪 LLM 呼叫、情緒分類器。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#agency-spectrum\">agency-spectrum</a>、<a class=\"wl\" href=\"#workflow-vs-agent\">workflow-vs-agent</a>、<a class=\"wl\" href=\"#agent-loop\">agent-loop</a>、<a class=\"wl\" href=\"#planning\">planning</a>、<a class=\"wl\" href=\"#memory\">memory</a>、<a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a>、<a class=\"wl\" href=\"#agent-definitions-compared\">agent-definitions-compared</a></p>", "path": "wiki/concepts/what-is-an-agent.md"}, "when-to-use-agents": {"title": "什麼時候該（不該）用 Agent", "meta": "類型：concept｜來源：[01, 04]｜更新：2026-11-15", "html": "<h1>什麼時候該用 Agent？</h1>\n<h2>先從最簡單的開始</h2>\n<ul>\n<li>先找最簡單的解法，必要時才加複雜度，甚至可能根本不需要 agentic system。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>很多應用只要把一次 LLM 呼叫（加上檢索和範例）優化好就夠了。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>Agentic system 是用延遲和成本換取更好的任務表現。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n</ul>\n<h2>OpenAI 的三個判斷條件</h2>\n<ol>\n<li><strong>複雜決策</strong>：需要細緻判斷、處理例外，例如退款審核。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li><strong>難以維護的規則</strong>：規則多又複雜，例如供應商資安審查。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li><strong>大量非結構化資料</strong>：要理解文件、跟使用者對話，例如房屋保險理賠。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>都不符合的話，用確定性的（deterministic）解法可能就夠了。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>比喻：規則引擎像一張檢查清單，agent 像經驗豐富的調查員。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n</ol>\n<h2>適合 agent 的任務特徵</h2>\n<ul>\n<li>同時需要對話和行動、成功標準清楚、能形成回饋循環、有人類監督，例如客服、寫程式。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>程式碼可以用自動化測試驗證，agent 能根據測試結果反覆修改。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#workflow-vs-agent\">workflow-vs-agent</a>、<a class=\"wl\" href=\"#guardrails-and-oversight\">guardrails-and-oversight</a></p>", "path": "wiki/concepts/when-to-use-agents.md"}, "workflow-patterns": {"title": "五種 Workflow 模式", "meta": "類型：concept｜來源：[01]｜更新：2026-11-15", "html": "<h1>五種 Workflow 模式（Anthropic）</h1>\n<table>\n<thead>\n<tr>\n<th>模式</th>\n<th>做法</th>\n<th>何時用 / 例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Prompt chaining</td>\n<td>拆成固定的連續步驟，每一步處理上一步的輸出，中間可加程式「關卡」檢查<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>寫大綱 → 檢查大綱 → 依大綱寫全文<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n</tr>\n<tr>\n<td>Routing</td>\n<td>先分類輸入，再送到專門的後續流程<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>客服問題分流；簡單題給小模型、難題給大模型<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n</tr>\n<tr>\n<td>Parallelization</td>\n<td>拆成獨立子任務同時跑（sectioning），或同一任務跑多次再投票（voting）<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>一個模型回答、另一個同時做安全審查；多個 prompt 一起找程式漏洞<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n</tr>\n<tr>\n<td>Orchestrator-workers</td>\n<td>中央 LLM 依輸入<strong>動態</strong>拆解任務、分派給 worker、再彙整<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>多檔案的程式修改；多來源的資料搜尋<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n</tr>\n<tr>\n<td>Evaluator-optimizer</td>\n<td>一個 LLM 產生內容，另一個評估並給回饋，循環修正<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>有明確評估標準時，例如文學翻譯<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n</tr>\n</tbody>\n</table>\n<ul>\n<li>這些積木不是規定，可以依需求組合，但只有在能證明效果更好時才增加複雜度。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>Orchestrator-workers 和 parallelization 的差別：子任務是不是事先定好。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#workflow-vs-agent\">workflow-vs-agent</a>、<a class=\"wl\" href=\"#multi-agent-orchestration\">multi-agent-orchestration</a>、<a class=\"wl\" href=\"#augmented-llm\">augmented-llm</a></p>", "path": "wiki/concepts/workflow-patterns.md"}, "workflow-vs-agent": {"title": "Workflow vs Agent", "meta": "類型：concept｜來源：[01]｜更新：2026-11-15", "html": "<h1>Workflow vs Agent</h1>\n<h2>定義</h2>\n<ul>\n<li><strong>Workflow</strong>：LLM 和工具依照<strong>預先寫好的程式路徑</strong>來編排。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li><strong>Agent</strong>：LLM <strong>自己動態決定</strong>流程和要用哪些工具，掌控任務怎麼完成。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n<li>Anthropic 把兩者統稱為 agentic systems，差別在「流程由誰決定」。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n</ul>\n<h2>怎麼選</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Workflow</th>\n<th>Agent</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>適合</td>\n<td>定義清楚、需要可預測和一致性的任務<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>需要彈性、由模型做決策的情境<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n</tr>\n<tr>\n<td>代價</td>\n<td>比較不彈性<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n<td>延遲、成本較高，錯誤可能累積<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></td>\n</tr>\n</tbody>\n</table>\n<h2>一個好記的說法</h2>\n<ul>\n<li>誰在開車？Workflow 是工程師事先畫好路線，agent 是 LLM 邊開邊決定下一個路口。<span class=\"note-tag\" title=\"本 Wiki 自己加的說明，不是來源原文\">註解</span>（這是本 Wiki 自己加的比喻，不是來源原文）</li>\n</ul>\n<h2>相關頁面</h2>\n<p><a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a>、<a class=\"wl\" href=\"#agency-spectrum\">agency-spectrum</a>、<a class=\"wl\" href=\"#workflow-patterns\">workflow-patterns</a>、<a class=\"wl\" href=\"#when-to-use-agents\">when-to-use-agents</a>、<a class=\"wl\" href=\"#agent-definitions-compared\">agent-definitions-compared</a></p>", "path": "wiki/concepts/workflow-vs-agent.md"}, "index": {"title": "Index｜AI Agents LLM Wiki", "meta": "", "html": "\n<div class=\"intro\">\n<p><b>主題：AI Agents</b>。依照 Karpathy 的 LLM Wiki 架構建立：原始資料（raw）由人挑選、不可修改；\nWiki 頁面由 LLM 撰寫與維護；schema 規定格式與流程。</p>\n<p>內容：7 份原始資料（1 份方法論＋6 篇主題資料）、6 頁來源摘要、14 頁概念、\n2 頁比較。每一句事實都標有 <a class=\"cite\" href=\"#raw-01\">raw:XX</a>，點下去可以看原始資料；\nLLM 自己加的比喻標為 <span class=\"note-tag\">註解</span>。</p>\n</div><h1>Index｜AI Agents LLM Wiki</h1>\n<blockquote>\n<p>Query 時先讀這頁。每頁一行摘要。</p>\n</blockquote>\n<h2>來源摘要（sources/）</h2>\n<ul>\n<li><a class=\"wl\" href=\"#src-anthropic-effective-agents\">src-anthropic-effective-agents</a>：workflow vs agent、五種模式、三大原則</li>\n<li><a class=\"wl\" href=\"#src-weng-autonomous-agents\">src-weng-autonomous-agents</a>：LLM 大腦 + 規劃 / 記憶 / 工具；三大挑戰</li>\n<li><a class=\"wl\" href=\"#src-react-paper\">src-react-paper</a>：Thought/Action/Observation；ALFWorld +34%、WebShop +10%</li>\n<li><a class=\"wl\" href=\"#src-openai-practical-guide\">src-openai-practical-guide</a>：模型 / 工具 / 指令；run loop；manager 與 handoff；guardrails</li>\n<li><a class=\"wl\" href=\"#src-hf-what-is-an-agent\">src-hf-what-is-an-agent</a>：Alfred 比喻、大腦／身體、agency 光譜</li>\n<li><a class=\"wl\" href=\"#src-anthropic-mcp\">src-anthropic-mcp</a>：MCP 發表文：client/server、預建 server</li>\n</ul>\n<h2>總覽</h2>\n<ul>\n<li><a class=\"wl\" href=\"#overview\">overview</a>：一句話定義、閱讀順序、跨來源的共同結論</li>\n</ul>\n<h2>比較（comparisons/）</h2>\n<ul>\n<li><a class=\"wl\" href=\"#agent-definitions-compared\">agent-definitions-compared</a>：Anthropic / OpenAI / HF 的定義對照</li>\n<li><a class=\"wl\" href=\"#source-discrepancies\">source-discrepancies</a>：來源差異與時效紀錄</li>\n</ul>\n<h2>概念（concepts/）</h2>\n<ul>\n<li><a class=\"wl\" href=\"#workflow-vs-agent\">workflow-vs-agent</a>：流程是預先寫好的，還是由 LLM 自己決定</li>\n<li><a class=\"wl\" href=\"#augmented-llm\">augmented-llm</a>：LLM + 檢索 + 工具 + 記憶的基本積木</li>\n<li><a class=\"wl\" href=\"#workflow-patterns\">workflow-patterns</a>：chaining / routing / parallel / orchestrator / evaluator</li>\n<li><a class=\"wl\" href=\"#when-to-use-agents\">when-to-use-agents</a>：先求簡單；OpenAI 的三個判斷條件</li>\n<li><a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a>：工具類型、ACI、防呆設計</li>\n<li><a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a>：三個來源的定義、元件拆解、Alfred 比喻</li>\n<li><a class=\"wl\" href=\"#planning\">planning</a>：CoT、ToT、LLM+P、ReAct、Reflexion</li>\n<li><a class=\"wl\" href=\"#memory\">memory</a>：人類記憶的對照、向量檢索</li>\n<li><a class=\"wl\" href=\"#agent-challenges\">agent-challenges</a>：context 有限、長期規劃、介面不可靠、錯誤累積</li>\n<li><a class=\"wl\" href=\"#agent-loop\">agent-loop</a>：Thought → Action → Observation 與停止條件</li>\n<li><a class=\"wl\" href=\"#multi-agent-orchestration\">multi-agent-orchestration</a>：先單一 agent；manager vs decentralized</li>\n<li><a class=\"wl\" href=\"#guardrails-and-oversight\">guardrails-and-oversight</a>：七種 guardrail、何時交給人類</li>\n<li><a class=\"wl\" href=\"#agency-spectrum\">agency-spectrum</a>：☆☆☆ 到 ★★★ 的五個等級</li>\n<li><a class=\"wl\" href=\"#mcp\">mcp</a>：標準化的工具與資料接口</li>\n</ul>", "path": "wiki/index.md"}, "log": {"title": "Log（只能 append）", "meta": "", "html": "<h1>Log（只能 append）</h1>\n<h2>[2026-11-15] schema | 建立 CLAUDE.md</h2>\n<ul>\n<li>與使用者討論後決定：主題 AI Agents、觀眾為修過 AI 入門課的同學、由 LLM 搜尋挑選資料</li>\n</ul>\n<h2>[2026-11-15] fetch | 取得 7 份 raw</h2>\n<ul>\n<li>00 Karpathy gist（方法論）、01–06 主題資料</li>\n<li>問題：modelcontextprotocol.io 不在允許清單內 → 改抓 Anthropic 官方 MCP 發表文（raw/06）</li>\n<li>問題：Karpathy gist 擷取只涵蓋前 100,000 / 107,212 字元 → 檔頭已註明</li>\n</ul>\n<h2>[2026-11-15] discuss | 6 篇重點與概念頁結構，經使用者確認後才開始生成</h2>\n<h2>[2026-11-15] ingest | 01 Anthropic Building effective agents</h2>\n<ul>\n<li>新增：src-anthropic-effective-agents、workflow-vs-agent、augmented-llm、workflow-patterns、when-to-use-agents、tools-and-aci</li>\n<li>lint #1：11 error，全部是「連到尚未建立的頁」→ ingest 途中這是正常的，lint 改成 <code>--ingest</code> 模式時只算 warning</li>\n<li>新增「引用核對」：標了〔raw:XX〕的句子中，英文術語與數字必須真的出現在 raw/XX</li>\n<li>人工抽查發現：workflow-vs-agent 的「誰在開車」比喻是 LLM 自己寫的，卻標成<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a>→ 新增<span class=\"note-tag\" title=\"本 Wiki 自己加的說明，不是來源原文\">註解</span>標籤，並寫進 schema</li>\n<li>人工抽查發現：when-to-use-agents、tools-and-aci 在 ingest 01 時就引用了 02/04/05（因為 raw 檔已經存在，LLM 提前讀了）→ 內容正確，但違反「一次一篇」；後續 ingest 時再複核這兩頁</li>\n</ul>\n<h2>[2026-11-15] ingest | 02 Weng LLM Powered Autonomous Agents</h2>\n<ul>\n<li>新增：src-weng-autonomous-agents、what-is-an-agent、planning、memory、agent-challenges</li>\n<li>發現來源差異：ReAct 年份（Weng 寫 2023、arXiv 初版 2022）→ 待建 source-discrepancies</li>\n<li>lint #2：3 error</li>\n<li>memory.md 寫了「表達力不如 attention」，但 raw/02 裡沒有這句（WebFetch 原始輸出有，存成 raw 時被我精簡掉了）→ raw 不可改，所以刪掉 wiki 這句</li>\n<li>agent-challenges.md 的「demo」不在 raw 中 → 改寫成 raw 有的說法</li>\n<li>src-weng 的 frontmatter 漏列 03 → 補上</li>\n<li>心得：錯誤源頭在「取得資料 → 存 raw」這一步太早精簡；之後的 raw 盡量保留原句</li>\n</ul>\n<h2>[2026-11-15] ingest | 03 ReAct 論文</h2>\n<ul>\n<li>新增：src-react-paper、agent-loop（同時整合 01/02/04/05 的說法）</li>\n</ul>\n<h2>[2026-11-15] ingest | 04 OpenAI practical guide</h2>\n<ul>\n<li>新增：src-openai-practical-guide、multi-agent-orchestration、guardrails-and-oversight</li>\n<li>複核：when-to-use-agents、tools-and-aci 先前提早引用的 04 內容，逐句和 raw/04 對照後都一致</li>\n<li>lint #3：1 error——「SQL injection」不在 raw/04 裡（又是存 raw 時精簡掉的）→ 刪除。這是同類錯誤第二次出現</li>\n</ul>\n<h2>[2026-11-15] ingest | 05 Hugging Face What is an Agent</h2>\n<ul>\n<li>新增：src-hf-what-is-an-agent、agency-spectrum；建立 agent-definitions-compared</li>\n</ul>\n<h2>[2026-11-15] ingest | 06 Anthropic MCP</h2>\n<ul>\n<li>新增：src-anthropic-mcp、mcp；建立 source-discrepancies、overview</li>\n<li>lint #4（嚴格模式）：3 error</li>\n<li>表格列同時有〔raw:〕和<span class=\"note-tag\" title=\"本 Wiki 自己加的說明，不是來源原文\">註解</span>被誤判 → lint 改成逐格檢查（工具本身的 bug）</li>\n<li>agency-spectrum 的 frontmatter 漏列 01 → 補上</li>\n<li>人工抽查：mcp 的「USB-C」比喻其實不在發表文原文 → 改標<span class=\"note-tag\" title=\"本 Wiki 自己加的說明，不是來源原文\">註解</span></li>\n<li>lint #5：0 error、2 warning（兩個來源差異段落都已收進 comparisons，經人工確認）</li>\n<li>Wiki 完成：6 篇來源摘要、14 個概念頁、2 個比較頁、overview、index、log</li>\n</ul>\n<h2>[2026-11-15] query | 為簡報產生大綱</h2>\n<ul>\n<li>依 CLAUDE.md：先讀 index → overview 的閱讀順序 → 各概念頁</li>\n<li>大綱 slides/outline.md：check_slides 0 error（14 張）</li>\n<li>HTML 第一版：check_slides 1 error——第 5 張寫了「CoT」，但引用的 planning 頁只有「Chain of Thought」→ 產生 HTML 時模型自己縮寫了，改回 Wiki 的寫法</li>\n<li>HTML 第二版：0 error</li>\n<li>視覺檢查（headless Chrome 逐張截圖）：</li>\n<li>互動 bug：在第 6 張按過「下一步」後，焦點留在按鈕上，方向鍵翻頁失效 → 修正鍵盤事件</li>\n<li>第 9–13 張下方空白太多 → 放大字級；14 張都沒有溢出、沒有 JS 錯誤</li>\n</ul>\n<h2>[2026-11-15] docs | 撰寫 docs/workflow-and-reflection.md（loop/graph 設計與反思，依本 log 撰寫）</h2>\n<h2>[2026-11-21] publish | 建立可瀏覽的 Wiki 網頁</h2>\n<ul>\n<li>tools/build_wiki_site.py：把 wiki/、raw/、CLAUDE.md 轉成單頁 HTML（site/wiki.html），檢查 33 頁之間沒有斷連結</li>\n</ul>\n<h2>[2026-11-21] publish | 準備 GitHub Pages 版本</h2>\n<ul>\n<li>tools/build_pages.py：產生 docs-ready 資料夾，最外層 index.html = Wiki，slides/index.html = 簡報；簡報頁底的 Wiki 來源標籤改成可以點，直接跳到對應的 Wiki 頁</li>\n</ul>", "path": "wiki/log.md"}, "overview": {"title": "總覽｜AI Agents", "meta": "類型：overview｜來源：[01, 02, 03, 04, 05, 06]｜更新：2026-11-15", "html": "<h1>AI Agents 總覽</h1>\n<p>一句話：<strong>AI Agent 是讓 LLM 在迴圈裡自己決定下一步、透過工具和環境互動，直到完成任務的系統。</strong><span class=\"note-tag\" title=\"本 Wiki 自己加的說明，不是來源原文\">註解</span>（綜合 <a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a> 的三個定義）</p>\n<h2>建議閱讀順序（也就是簡報的骨架）</h2>\n<ol>\n<li>是什麼 → <a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a>、<a class=\"wl\" href=\"#agency-spectrum\">agency-spectrum</a>、<a class=\"wl\" href=\"#agent-definitions-compared\">agent-definitions-compared</a></li>\n<li>由什麼組成 → <a class=\"wl\" href=\"#augmented-llm\">augmented-llm</a>、<a class=\"wl\" href=\"#planning\">planning</a>、<a class=\"wl\" href=\"#memory\">memory</a>、<a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a></li>\n<li>怎麼運作 → <a class=\"wl\" href=\"#agent-loop\">agent-loop</a></li>\n<li>怎麼搭 → <a class=\"wl\" href=\"#workflow-vs-agent\">workflow-vs-agent</a>、<a class=\"wl\" href=\"#workflow-patterns\">workflow-patterns</a>、<a class=\"wl\" href=\"#multi-agent-orchestration\">multi-agent-orchestration</a>、<a class=\"wl\" href=\"#mcp\">mcp</a></li>\n<li>何時用、要注意什麼 → <a class=\"wl\" href=\"#when-to-use-agents\">when-to-use-agents</a>、<a class=\"wl\" href=\"#agent-challenges\">agent-challenges</a>、<a class=\"wl\" href=\"#guardrails-and-oversight\">guardrails-and-oversight</a></li>\n</ol>\n<h2>跨來源的三個共同結論</h2>\n<ul>\n<li>從簡單開始，有需要才增加複雜度。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>工具（和工具說明）的品質決定 agent 的品質。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a><a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>要有停止條件、guardrails 和人類介入點。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n</ul>", "path": "wiki/overview.md"}, "src-anthropic-effective-agents": {"title": "來源摘要｜Anthropic〈Building effective agents〉", "meta": "類型：source｜來源：[01]｜更新：2026-11-15", "html": "<h1>Anthropic〈Building effective agents〉（2024-12-19）</h1>\n<p><strong>一句話</strong>：做 agent 不用從複雜框架開始，最成功的團隊都是把簡單、可組合的模式拼起來。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></p>\n<h2>重點</h2>\n<ul>\n<li>把所有變體統稱為 agentic systems，再細分成 <strong>workflow</strong>（預先寫好的程式路徑）和 <strong>agent</strong>（LLM 自己決定流程與工具）。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a> → <a class=\"wl\" href=\"#workflow-vs-agent\">workflow-vs-agent</a></li>\n<li>基本積木是 <strong>augmented LLM</strong>：LLM 加上檢索、工具、記憶。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a> → <a class=\"wl\" href=\"#augmented-llm\">augmented-llm</a></li>\n<li>五種 workflow 模式：prompt chaining、routing、parallelization、orchestrator-workers、evaluator-optimizer。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a> → <a class=\"wl\" href=\"#workflow-patterns\">workflow-patterns</a></li>\n<li>Agent 的實作常常只是「LLM 根據環境回饋使用工具，然後不斷循環」。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a> → <a class=\"wl\" href=\"#agent-loop\">agent-loop</a></li>\n<li>三大原則：保持簡單、讓規劃步驟透明、用心設計 agent-computer interface（ACI）。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a> → <a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a></li>\n<li>先找最簡單的解法，必要時才增加複雜度。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a> → <a class=\"wl\" href=\"#when-to-use-agents\">when-to-use-agents</a></li>\n</ul>\n<h2>時效提醒</h2>\n<ul>\n<li>頁面編者註說文中部分工具描述已經過時，所以本 Wiki 不收錄框架和模型名稱。<a class=\"cite\" href=\"#raw-01\" title=\"原始資料 01\">raw:01</a></li>\n</ul>", "path": "wiki/sources/src-anthropic-effective-agents.md"}, "src-anthropic-mcp": {"title": "來源摘要｜Anthropic〈Introducing the Model Context Protocol〉", "meta": "類型：source｜來源：[06]｜更新：2026-11-15", "html": "<h1>Introducing the Model Context Protocol（2024-11-25）</h1>\n<p><strong>一句話</strong>：用一個開放標準取代各自寫一套的整合方式，讓 AI 應用能接上資料和工具。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></p>\n<h2>重點</h2>\n<ul>\n<li>問題：模型被困在資料孤島裡，每接一個新資料源都要客製整合。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></li>\n<li>架構：開發者用 MCP server 公開資料，AI 應用（MCP client）連過去。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a> → <a class=\"wl\" href=\"#mcp\">mcp</a></li>\n<li>首批釋出：規格與 SDK、Claude Desktop 支援本地 server、開源 server 儲存庫。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></li>\n<li>預建 server：Google Drive、Slack、GitHub、Git、Postgres、Puppeteer。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></li>\n</ul>\n<h2>取得紀錄</h2>\n<ul>\n<li>原本想抓 modelcontextprotocol.io 官方文件，但不在允許清單內，所以改用這篇官方發表文。<a class=\"cite\" href=\"#raw-06\" title=\"原始資料 06\">raw:06</a></li>\n</ul>", "path": "wiki/sources/src-anthropic-mcp.md"}, "src-hf-what-is-an-agent": {"title": "來源摘要｜Hugging Face Agents Course〈What is an Agent?〉", "meta": "類型：source｜來源：[05]｜更新：2026-11-15", "html": "<h1>Hugging Face〈What is an Agent?〉</h1>\n<p><strong>一句話</strong>：Agent 是利用 AI 模型和環境互動、達成使用者目標的系統；大腦負責想，身體（工具）負責做。<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></p>\n<h2>重點</h2>\n<ul>\n<li>Alfred 煮咖啡的比喻 → <a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a><a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>大腦（AI 模型）＋身體（能力與工具）<a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>Agency 是一個光譜，從 ☆☆☆ 到 ★★★ → <a class=\"wl\" href=\"#agency-spectrum\">agency-spectrum</a><a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>LLM 只能產生文字，要靠工具才能行動；一個 action 可能用到多個 tool → <a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a><a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n<li>工作流程：Thought → Action → Observation → <a class=\"wl\" href=\"#agent-loop\">agent-loop</a><a class=\"cite\" href=\"#raw-05\" title=\"原始資料 05\">raw:05</a></li>\n</ul>", "path": "wiki/sources/src-hf-what-is-an-agent.md"}, "src-openai-practical-guide": {"title": "來源摘要｜OpenAI〈A practical guide to building agents〉", "meta": "類型：source｜來源：[04]｜更新：2026-11-15", "html": "<h1>OpenAI〈A practical guide to building agents〉（2025）</h1>\n<p><strong>一句話</strong>：Agent 是「代替你獨立完成任務的系統」，由模型、工具、指令三要素組成；從單一 agent 開始，每一層都要加上 guardrails。<a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></p>\n<h2>重點</h2>\n<ul>\n<li>定義與「什麼不是 agent」→ <a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>何時該用：複雜決策、難以維護的規則、大量非結構化資料 → <a class=\"wl\" href=\"#when-to-use-agents\">when-to-use-agents</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>工具三類：Data、Action、Orchestration → <a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>Run loop 的結束條件 → <a class=\"wl\" href=\"#agent-loop\">agent-loop</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>多代理：manager pattern 與 decentralized（handoff）pattern → <a class=\"wl\" href=\"#multi-agent-orchestration\">multi-agent-orchestration</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n<li>Guardrails 分層防護與人類介入的時機 → <a class=\"wl\" href=\"#guardrails-and-oversight\">guardrails-and-oversight</a><a class=\"cite\" href=\"#raw-04\" title=\"原始資料 04\">raw:04</a></li>\n</ul>", "path": "wiki/sources/src-openai-practical-guide.md"}, "src-react-paper": {"title": "來源摘要｜ReAct 論文（Yao et al.）", "meta": "類型：source｜來源：[03]｜更新：2026-11-15", "html": "<h1>ReAct: Synergizing Reasoning and Acting in Language Models</h1>\n<p><strong>一句話</strong>：讓 LLM 把「推理」和「行動」交錯進行，比只推理或只行動都好。<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></p>\n<h2>重點</h2>\n<ul>\n<li>以前推理（如 chain-of-thought）和行動（如產生動作計畫）是分開研究的。<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></li>\n<li>推理幫模型建立、追蹤、更新計畫；行動讓模型從外部取得資訊。<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a> → <a class=\"wl\" href=\"#agent-loop\">agent-loop</a></li>\n<li>HotpotQA、Fever：接上簡單的 Wikipedia API，就能減少 CoT 的幻覺與錯誤傳遞。<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></li>\n<li>ALFWorld、WebShop：絕對成功率比模仿學習和強化學習方法分別高 34% 和 10%，而且只用了 1–2 個 in-context 範例。<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></li>\n<li>額外好處：人類比較看得懂它的推理過程，也比較容易信任和除錯。<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></li>\n</ul>\n<h2>書目資訊</h2>\n<ul>\n<li>arXiv v1：2022-10-06；v3：2023-03-10（ICLR 2023 定稿）<a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a> → <a class=\"wl\" href=\"#source-discrepancies\">source-discrepancies</a></li>\n</ul>", "path": "wiki/sources/src-react-paper.md"}, "src-weng-autonomous-agents": {"title": "來源摘要｜Lilian Weng〈LLM Powered Autonomous Agents〉", "meta": "類型：source｜來源：[02, 03]｜更新：2026-11-15", "html": "<h1>Lilian Weng〈LLM Powered Autonomous Agents〉（2023-06-23）</h1>\n<p><strong>一句話</strong>：LLM 是 agent 的大腦，再搭配規劃、記憶、工具使用三個元件。<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></p>\n<h2>重點</h2>\n<ul>\n<li>三元件架構 → <a class=\"wl\" href=\"#what-is-an-agent\">what-is-an-agent</a><a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li>規劃：任務拆解（CoT、Tree of Thoughts、LLM+P）與自我反思（ReAct、Reflexion）→ <a class=\"wl\" href=\"#planning\">planning</a><a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li>記憶：對照人類的感官記憶、短期記憶、長期記憶 → <a class=\"wl\" href=\"#memory\">memory</a><a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li>工具：MRKL、Toolformer、HuggingGPT、API-Bank → <a class=\"wl\" href=\"#tools-and-aci\">tools-and-aci</a><a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li>案例：ChemCrow、Generative Agents、AutoGPT、GPT-Engineer<a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n<li>三大挑戰：context 長度有限、長期規劃困難、自然語言介面不可靠 → <a class=\"wl\" href=\"#agent-challenges\">agent-challenges</a><a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a></li>\n</ul>\n<h2>⚠️ 來源差異</h2>\n<ul>\n<li>本文把 ReAct 標為 Yao et al. 2023，arXiv 初版其實是 2022-10 → <a class=\"wl\" href=\"#source-discrepancies\">source-discrepancies</a><a class=\"cite\" href=\"#raw-02\" title=\"原始資料 02\">raw:02</a><a class=\"cite\" href=\"#raw-03\" title=\"原始資料 03\">raw:03</a></li>\n</ul>", "path": "wiki/sources/src-weng-autonomous-agents.md"}, "raw-00": {"title": "00｜LLM Wiki (idea file)", "meta": "url：https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f　title：LLM Wiki (idea file)　author：Andrej Karpathy　published：2026-04-04　retrieved：2026-11-15　method：WebFetch 擷取重點（非全文；頁面 107,212 字元，擷取涵蓋前 100,000 字元）　role：方法論來源（說明本 Wiki 的建法），不計入主題資料", "html": "<p class=\"raw-note\">原始資料（不可修改）。Wiki 頁面裡的 raw 標籤都連到這裡。</p><h1>LLM Wiki: Outline (extracted notes)</h1>\n<h2>Core idea</h2>\n<ul>\n<li>Standard RAG retrieves raw documents at query time and re-derives answers each time, so nothing accumulates.</li>\n<li>The LLM incrementally builds and maintains a persistent, interlinked markdown wiki between the human and the raw sources. \"The wiki is a persistent, compounding artifact.\"</li>\n<li>Human curates sources and asks questions; the LLM does summarizing, cross-referencing, filing, bookkeeping.</li>\n</ul>\n<h2>Three layers</h2>\n<ol>\n<li>Raw sources — curated articles, papers, images, data. LLM reads, never modifies. Source of truth.</li>\n<li>The wiki — LLM-generated markdown: summaries, entity pages, concept pages, comparisons, overview, synthesis. LLM owns it; human reads it.</li>\n<li>The schema — e.g. CLAUDE.md / AGENTS.md: structure, conventions, workflows. Co-evolved by human and LLM.</li>\n</ol>\n<h2>Operations</h2>\n<ul>\n<li>Ingest: add source → LLM reads, discusses takeaways, writes summary page, updates index, revises related entity/concept pages, appends log. One source may touch 10–15 pages. One-at-a-time (supervised) or batch; record choice in schema.</li>\n<li>Query: search wiki, read relevant pages, synthesize cited answer. Output forms: markdown, tables, slide decks (Marp), charts, canvases. File valuable answers back into the wiki.</li>\n<li>Lint: periodic health check — contradictions, stale claims, orphan pages, missing concept pages, missing cross-references, data gaps fillable by web search. Suggest new questions/sources.</li>\n</ul>\n<h2>index.md / log.md</h2>\n<ul>\n<li>index.md: content-oriented catalog; each page with link + one-line summary (+ optional metadata), grouped by category. Updated every ingest; read first during query. Works at ~100 sources / hundreds of pages without embedding RAG.</li>\n<li>log.md: chronological, append-only record of ingests, queries, lint passes. Consistent prefix (date, operation, title) so unix tools can parse.</li>\n</ul>\n<h2>Extras (optional)</h2>\n<p>Obsidian (graph view, backlinks), YAML frontmatter + Dataview, Marp slides, web clipper, raw/assets/ for images, qmd search, git for history. Intentionally abstract; all components optional.</p>", "path": "raw/00-karpathy-llm-wiki.md"}, "raw-01": {"title": "01｜Building effective agents", "meta": "url：https://www.anthropic.com/engineering/building-effective-agents　title：Building effective agents　author：Erik Schluntz, Barry Zhang (Anthropic)　published：2024-12-19　retrieved：2026-11-15　method：WebFetch 擷取重點（非全文）　note：頁面編者註表示文中部分工具描述自 2024-12 以來已改變", "html": "<p class=\"raw-note\">原始資料（不可修改）。Wiki 頁面裡的 raw 標籤都連到這裡。</p><h1>Building effective agents — extracted notes</h1>\n<h2>Intro</h2>\n<ul>\n<li>Worked with dozens of teams building LLM agents. Most successful implementations used simple, composable patterns, not complex frameworks.</li>\n</ul>\n<h2>Definitions</h2>\n<ul>\n<li>\"Agent\" has no single definition. Anthropic calls all variants <strong>agentic systems</strong>, with an architectural distinction:</li>\n<li><strong>Workflows</strong>: LLMs and tools orchestrated through predefined code paths.</li>\n<li><strong>Agents</strong>: LLMs dynamically direct their own processes and tool usage, maintaining control over how they accomplish tasks.</li>\n</ul>\n<h2>When (not) to use agents</h2>\n<ul>\n<li>Find the simplest solution; increase complexity only when needed — may mean no agentic system at all.</li>\n<li>Agentic systems trade latency and cost for better task performance.</li>\n<li>Workflows: predictability/consistency for well-defined tasks. Agents: flexibility and model-driven decision-making at scale.</li>\n<li>Often a single LLM call with retrieval and in-context examples is enough.</li>\n</ul>\n<h2>Frameworks</h2>\n<ul>\n<li>Examples: Claude Agent SDK, Strands Agents SDK (AWS), Rivet, Vellum.</li>\n<li>Abstraction layers can obscure prompts/responses, harder to debug; tempt unnecessary complexity.</li>\n<li>Start with LLM APIs directly; if using a framework, understand underlying code.</li>\n</ul>\n<h2>Building block: augmented LLM</h2>\n<ul>\n<li>LLM + retrieval + tools + memory. Model generates its own search queries, selects tools, decides what to retain.</li>\n<li>MCP is one way to implement these augmentations.</li>\n</ul>\n<h2>Workflow patterns</h2>\n<ol>\n<li>Prompt chaining — sequential steps, each call processes previous output; programmatic \"gate\" checks between steps. Use when task decomposes into fixed subtasks; trades latency for accuracy. Ex: write outline → check against criteria → write document.</li>\n<li>Routing — classify input, direct to specialized follow-up. Ex: customer service query types; easy questions to small model, hard to capable model.</li>\n<li>Parallelization — sectioning (independent subtasks in parallel) or voting (same task multiple times). Ex: guardrail model screens while another answers; multiple prompts review code for vulnerabilities.</li>\n<li>Orchestrator-workers — central LLM dynamically breaks down tasks, delegates to workers, synthesizes. Subtasks not predefined. Ex: multi-file coding changes; multi-source search.</li>\n<li>Evaluator-optimizer — one LLM generates, another evaluates and gives feedback, in a loop. Use when clear evaluation criteria and iterative refinement adds measurable value. Ex: literary translation; multi-round search.</li>\n</ol>\n<h2>Agents</h2>\n<ul>\n<li>Begin with a human command or discussion; plan and operate independently; may return to human for info/judgment.</li>\n<li>At each step obtain \"ground truth\" from environment (tool results, code execution) to assess progress.</li>\n<li>Can pause at checkpoints/blockers for human feedback; stopping conditions such as max iterations.</li>\n<li>Implementation is often just an LLM using tools based on environmental feedback in a loop → toolset design and documentation crucial.</li>\n<li>Use for open-ended problems where number of steps can't be predicted or hardcoded; requires trust; suits scaling in trusted environments.</li>\n<li>Risks: higher costs, compounding errors → extensive testing in sandboxed environments with guardrails.</li>\n<li>Examples: SWE-bench coding agent; \"computer use\" reference implementation.</li>\n</ul>\n<h2>Three core principles</h2>\n<ol>\n<li>Maintain simplicity in agent design.</li>\n<li>Prioritize transparency by explicitly showing the agent's planning steps.</li>\n<li>Carefully craft the agent-computer interface (ACI) through thorough tool documentation and testing.</li>\n</ol>\n<h2>Appendix 1: Agents in practice</h2>\n<ul>\n<li>Good fit: conversation + action, clear success criteria, feedback loops, meaningful human oversight.</li>\n<li>Customer support: tools for customer data, order history, KB; actions like refunds; success measurable (some charge only for successful resolutions).</li>\n<li>Coding agents: verifiable via automated tests; agents can iterate on test results; SWE-bench Verified from PR description alone; human review still crucial.</li>\n</ul>\n<h2>Appendix 2: Prompt engineering your tools</h2>\n<ul>\n<li>Tool definitions deserve as much prompt-engineering attention as overall prompts.</li>\n<li>Give model enough tokens to think; keep formats close to natural internet text; avoid formatting overhead (counting lines, escaping).</li>\n<li>ACI: put yourself in model's shoes; include example usage, edge cases, input formats, boundaries; write like a docstring for a junior developer; test many inputs; <strong>poka-yoke</strong> tools.</li>\n<li>SWE-bench anecdote: spent more time optimizing tools than the overall prompt; model erred with relative paths → required absolute paths → used flawlessly.</li>\n</ul>", "path": "raw/01-anthropic-building-effective-agents.md"}, "raw-02": {"title": "02｜LLM Powered Autonomous Agents", "meta": "url：https://lilianweng.github.io/posts/2023-06-23-agent/　title：LLM Powered Autonomous Agents　author：Lilian Weng (Lil&#x27;Log)　published：2023-06-23　retrieved：2026-11-15　method：WebFetch 擷取重點（非全文）", "html": "<p class=\"raw-note\">原始資料（不可修改）。Wiki 頁面裡的 raw 標籤都連到這裡。</p><h1>LLM Powered Autonomous Agents — extracted notes</h1>\n<h2>1. Overview</h2>\n<ul>\n<li>LLM functions as the agent's brain, complemented by: <strong>Planning</strong>, <strong>Memory</strong>, <strong>Tool use</strong>.</li>\n<li>Planning: subgoal decomposition; reflection and refinement of past actions.</li>\n<li>Memory: short-term = in-context learning; long-term = external vector store + fast retrieval.</li>\n<li>Tool use: call external APIs for info missing from weights (current info, code execution, proprietary sources).</li>\n</ul>\n<h2>2. Task decomposition</h2>\n<ul>\n<li>Chain of Thought (Wei et al. 2022): \"think step by step\"; more test-time computation; interpretable.</li>\n<li>Tree of Thoughts (Yao et al. 2023): multiple thoughts per step → tree; BFS/DFS; states evaluated by classifier prompt or majority vote.</li>\n<li>Decomposition by (1) simple prompting (\"Steps for XYZ.\\n1.\"), (2) task-specific instructions, (3) human inputs.</li>\n<li>LLM+P (Liu et al. 2023): external classical planner via PDDL; LLM translates problem → planner → translate back.</li>\n</ul>\n<h2>3. Self-reflection</h2>\n<ul>\n<li>ReAct (Yao et al. 2023): reasoning + acting; action space = task actions + language. Template: Thought / Action / Observation, repeated. Outperforms Act-only baseline.</li>\n<li>Reflexion (Shinn &amp; Labash 2023): dynamic memory + self-reflection; binary reward; heuristic detects inefficient planning (long trajectory w/o success) and hallucination (consecutive identical actions → same observation); reflections from two-shot examples, up to three kept in working memory. On AlfWorld, hallucination more common than inefficient planning.</li>\n<li>Chain of Hindsight (Liu et al. 2023): fine-tune on sequences of past outputs annotated with feedback.</li>\n<li>Algorithm Distillation (Laskin et al. 2023): cross-episode histories in RL.</li>\n</ul>\n<h2>4. Memory (mapping to human memory)</h2>\n<ul>\n<li>Sensory memory → embedding representations of raw inputs.</li>\n<li>Short-term / working memory (~7 items, 20–30 s) → in-context learning, limited by context window.</li>\n<li>Long-term memory (explicit: episodic, semantic; implicit: procedural) → external vector store.</li>\n<li>MIPS with ANN algorithms: LSH, ANNOY, HNSW, FAISS, ScaNN.</li>\n</ul>\n<h2>5. Tool use</h2>\n<ul>\n<li>MRKL (Karpas et al. 2022): LLM routes to expert modules (calculator, weather API). Lesson: knowing when/how to use tools is crucial.</li>\n<li>TALM, Toolformer: fine-tune LM to use tool APIs.</li>\n<li>ChatGPT Plugins, OpenAI function calling as practical examples.</li>\n<li>HuggingGPT: ChatGPT as task planner → model selection → task execution → response generation.</li>\n<li>API-Bank: 53 tools, 264 dialogues, 568 API calls; 3 levels: call API, retrieve API, plan API.</li>\n</ul>\n<h2>6. Case studies</h2>\n<ul>\n<li>ChemCrow: 13 expert tools, ReAct format; LLM-based eval rated it ≈ GPT-4, but human experts strongly favored ChemCrow → LLMs may not judge own performance well in expert domains.</li>\n<li>Boiko et al. 2023: scientific discovery agent; risk test.</li>\n<li>Generative Agents (Park et al. 2023): 25 characters in a sandbox; memory stream, retrieval (recency, importance, relevance), reflection, planning &amp; reacting; emergent social behavior.</li>\n<li>AutoGPT: autonomous agent; reliability issues; much code is format parsing.</li>\n<li>GPT-Engineer: generates code repo from task; asks clarifying questions first.</li>\n</ul>\n<h2>7. Challenges</h2>\n<ul>\n<li>Finite context length.</li>\n<li>Long-term planning and task decomposition; hard to adjust plans after unexpected errors.</li>\n<li>Reliability of natural language interface: formatting errors, rebellious behavior → much code parses output.</li>\n</ul>", "path": "raw/02-weng-llm-powered-autonomous-agents.md"}, "raw-03": {"title": "03｜ReAct: Synergizing Reasoning and Acting in Language Models", "meta": "url：https://arxiv.org/abs/2210.03629　title：&quot;ReAct: Synergizing Reasoning and Acting in Language Models&quot;　author：Shunyu Yao, Jeffrey Zhao, Dian Yu, Nan Du, Izhak Shafran, Karthik Narasimhan, Yuan Cao (Princeton, Google Research)　published：2022-10-06 (v1); v3 2023-03-10 (ICLR 2023 camera-ready)　retrieved：2026-11-15　method：WebFetch 擷取 arXiv 摘要頁 + 搜尋結果中的 PDF 引言片段", "html": "<p class=\"raw-note\">原始資料（不可修改）。Wiki 頁面裡的 raw 標籤都連到這裡。</p><h1>ReAct — extracted notes</h1>\n<h2>Core idea</h2>\n<ul>\n<li>Reasoning (e.g., chain-of-thought) and acting (e.g., action plan generation) had been studied separately.</li>\n<li>ReAct prompts LLMs to generate reasoning traces and task-specific actions in an <strong>interleaved</strong> manner.</li>\n<li>Reasoning traces help the model induce, track, and update action plans and handle exceptions (\"reason to act\"); actions let it interface with external sources (knowledge bases, environments) to gather information (\"act to reason\").</li>\n<li>Human analogy (intro): cooking — reasoning and acting interleave (check ingredients, adjust plan).</li>\n</ul>\n<h2>Tasks &amp; results</h2>\n<ul>\n<li>HotpotQA (QA) and Fever (fact verification): with a simple Wikipedia API, ReAct overcomes hallucination and error propagation prevalent in chain-of-thought reasoning. Best overall: ReAct combined with CoT (internal + external knowledge).</li>\n<li>ALFWorld &amp; WebShop (interactive decision making): outperforms imitation and reinforcement learning methods by absolute success rate of <strong>34%</strong> and <strong>10%</strong> respectively, prompted with only one or two in-context examples.</li>\n</ul>\n<h2>Claimed benefits</h2>\n<ul>\n<li>Better performance than baselines; improved human interpretability, trustworthiness, diagnosability.</li>\n</ul>", "path": "raw/03-yao-react-paper.md"}, "raw-04": {"title": "04｜A practical guide to building agents", "meta": "url：https://cdn.openai.com/business-guides-and-resources/a-practical-guide-to-building-agents.pdf　title：A practical guide to building agents　author：OpenAI　published：2025 (PDF, 32 pages; no exact date on page)　retrieved：2026-11-15　method：WebFetch 擷取 PDF 重點（非全文）", "html": "<p class=\"raw-note\">原始資料（不可修改）。Wiki 頁面裡的 raw 標籤都連到這裡。</p><h1>A practical guide to building agents — extracted notes</h1>\n<h2>What is an agent</h2>\n<ul>\n<li>\"Agents are systems that independently accomplish tasks on your behalf.\"</li>\n<li>Workflow = sequence of steps to meet a user's goal (resolve support issue, book reservation, commit code, generate report).</li>\n<li>Core traits: (1) LLM manages workflow execution and decisions — recognizes completion, corrects actions, can halt and transfer control back to user on failure; (2) accesses tools to gather context and take actions, choosing dynamically based on current state, within guardrails.</li>\n<li>NOT agents: apps that use LLM but don't let it control workflow execution — simple chatbots, single-turn LLMs, sentiment classifiers.</li>\n</ul>\n<h2>When to build</h2>\n<ul>\n<li>Where deterministic/rule-based approaches fall short. Rules engine = checklist; agent = seasoned investigator.</li>\n<li>Criteria: (1) complex decision-making (refund approval), (2) difficult-to-maintain rules (vendor security reviews), (3) heavy reliance on unstructured data (home insurance claims).</li>\n<li>Otherwise a deterministic solution may suffice.</li>\n</ul>\n<h2>Design foundations</h2>\n<ul>\n<li>Model (reasoning/decisions), Tools (functions/APIs), Instructions (guidelines &amp; guardrails).</li>\n<li>Model selection: prototype with most capable model for baseline; swap smaller models where results hold; set up evals.</li>\n<li>Tool types: Data (retrieve context), Action (change systems), Orchestration (agents as tools).</li>\n<li>Legacy systems without APIs: computer-use models operate UIs.</li>\n<li>Instructions: use existing documents (SOPs, scripts, policies); break down tasks; define clear actions; capture edge cases; can auto-generate instructions with advanced models.</li>\n</ul>\n<h2>Orchestration</h2>\n<ul>\n<li>Single-agent first. Run loop continues until exit condition: final-output tool invoked; model responds without tool calls; error; max turns.</li>\n<li>Prompt templates with policy variables instead of many prompts.</li>\n<li>Split to multi-agent when: complex logic (many conditionals) or tool overload (similar/overlapping tools, not raw count; some handle 15+ distinct tools, others struggle with &lt;10 overlapping).</li>\n<li>Multi-agent modeled as graphs: agents = nodes; edges = tool calls (manager) or handoffs (decentralized).</li>\n<li>Manager pattern: central manager delegates to specialized agents via tool calls, keeps control (ex: translate to Spanish/French/Italian).</li>\n<li>Decentralized pattern: one-way handoffs between peers transferring conversation state (ex: triage agent → order management agent).</li>\n</ul>\n<h2>Guardrails</h2>\n<ul>\n<li>Layered defense; complement authentication/authorization/access control.</li>\n<li>Types: relevance classifier, safety classifier (jailbreaks/prompt injections), PII filter, moderation, tool safeguards (risk rating low/medium/high by read-only vs write, reversibility, permissions, financial impact), rules-based protections (blocklists, input length limits, regex), output validation.</li>\n<li>Build: start with data privacy &amp; content safety; add as edge cases appear; balance security vs UX.</li>\n<li>Agents SDK: optimistic execution; guardrails run concurrently; tripwire raises exception.</li>\n</ul>\n<h2>Human intervention</h2>\n<ul>\n<li>Especially early in deployment; helps find failures and edge cases.</li>\n<li>Triggers: exceeding failure thresholds (retries/actions); high-risk actions (cancel orders, large refunds, payments).</li>\n</ul>\n<h2>Conclusion</h2>\n<ul>\n<li>Strong foundations (capable model, well-defined tools, clear instructions); start with single agent; guardrails at every stage; deploy incrementally.</li>\n</ul>", "path": "raw/04-openai-practical-guide.md"}, "raw-05": {"title": "05｜What is an Agent? (AI Agents Course, Unit 1)", "meta": "url：https://huggingface.co/learn/agents-course/unit1/what-are-agents　title：What is an Agent? (AI Agents Course, Unit 1)　author：Hugging Face　published：2025 (course page; no exact date on page)　retrieved：2026-11-15　method：WebFetch 擷取重點（非全文）", "html": "<p class=\"raw-note\">原始資料（不可修改）。Wiki 頁面裡的 raw 標籤都連到這裡。</p><h1>What is an Agent? — extracted notes</h1>\n<h2>Alfred analogy</h2>\n<ul>\n<li>Alfred hears \"I would like a coffee please\" → understands natural language → reasons &amp; plans (go to kitchen, use coffee machine, brew, bring back) → acts using tools he knows (coffee machine) → delivers coffee.</li>\n</ul>\n<h2>Formal definition</h2>\n<ul>\n<li>An Agent is a system that leverages an AI model to interact with its environment in order to achieve a user-defined objective. It combines reasoning, planning, and execution of actions (often via external tools).</li>\n<li>\"Agency\" = ability to interact with the environment.</li>\n</ul>\n<h2>Two main parts</h2>\n<ol>\n<li>Brain (AI model): reasoning &amp; planning; decides which actions.</li>\n<li>Body (capabilities &amp; tools): what the agent is equipped to do; actions limited by what it's given (humans can't fly but can walk, run, jump, grab).</li>\n</ol>\n<h2>Spectrum of agency (table from smolagents conceptual guide)</h2>\n<table>\n<thead>\n<tr>\n<th>Stars</th>\n<th>Level</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>☆☆☆</td>\n<td>Simple processor</td>\n<td>output has no impact on program flow</td>\n</tr>\n<tr>\n<td>★☆☆</td>\n<td>Router</td>\n<td>output determines basic control flow</td>\n</tr>\n<tr>\n<td>★★☆</td>\n<td>Tool caller</td>\n<td>output determines function execution (which function, which args)</td>\n</tr>\n<tr>\n<td>★★★</td>\n<td>Multi-step agent</td>\n<td>output controls iteration and program continuation</td>\n</tr>\n<tr>\n<td>★★★</td>\n<td>Multi-agent</td>\n<td>one agentic workflow can start another</td>\n</tr>\n<tr>\n<td>(The page gives the last two the same rating.)</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<h2>Models</h2>\n<ul>\n<li>Most common: LLM (text in, text out), e.g., GPT-4, Llama, Gemini. Also VLMs (images). Course focuses on LLMs.</li>\n</ul>\n<h2>How agents take actions</h2>\n<ul>\n<li>LLMs can only generate text. Chat UIs make images because developers added tools (Eiffel Tower made of broccoli via image-generation tool).</li>\n<li>The model generates the tool call; surrounding code executes it.</li>\n<li>Agent can perform any task implemented via Tools. Ex: send_message_to(\"Manager\", ...).</li>\n<li>Tool design is very important. An Action is not the same as a Tool — one action may use several tools.</li>\n</ul>\n<h2>Example tasks</h2>\n<ul>\n<li>Personal virtual assistants; customer service chatbots; video game NPCs.</li>\n</ul>\n<h2>Summary</h2>\n<ul>\n<li>Agent uses an AI model (typically LLM) as reasoning core to: understand natural language; reason &amp; plan; interact with environment (gather info, act, observe results).</li>\n<li>Course workflow: Thought → Action → Observation.</li>\n</ul>", "path": "raw/05-huggingface-what-is-an-agent.md"}, "raw-06": {"title": "06｜Introducing the Model Context Protocol", "meta": "url：https://www.anthropic.com/news/model-context-protocol　title：Introducing the Model Context Protocol　author：Anthropic　published：2024-11-25　retrieved：2026-11-15　method：WebFetch 擷取重點（非全文）　note：原本想抓 modelcontextprotocol.io 官方文件，但該網址不在本工作區允許清單內，改用官方發表文", "html": "<p class=\"raw-note\">原始資料（不可修改）。Wiki 頁面裡的 raw 標籤都連到這裡。</p><h1>Introducing the Model Context Protocol — extracted notes</h1>\n<ul>\n<li>Open standard for connecting AI assistants to systems where data lives: content repositories, business tools, development environments. Goal: help frontier models produce better, more relevant responses.</li>\n<li>Problem: models are constrained by isolation from data — trapped behind information silos and legacy systems. Every new data source requires its own custom implementation → hard to scale.</li>\n<li>Solution: \"a universal, open standard\" replacing fragmented integrations with a single protocol.</li>\n<li>Architecture: developers expose data via <strong>MCP servers</strong>, or build AI applications (<strong>MCP clients</strong>) that connect to these servers. Secure, two-way connections.</li>\n<li>Released: (1) MCP specification and SDKs; (2) local MCP server support in Claude Desktop apps; (3) open-source repository of MCP servers.</li>\n<li>Pre-built servers: Google Drive, Slack, GitHub, Git, Postgres, Puppeteer.</li>\n<li>Early adopters: Block, Apollo; dev tools Zed, Replit, Codeium, Sourcegraph (help agents retrieve context for coding tasks).</li>\n<li>Created by David Soria Parra and Justin Spahr-Summers; developed as collaborative open-source project.</li>\n<li>Vision: AI systems maintain context as they move between tools and datasets.</li>\n<li>(Widely used analogy in docs/secondary sources: \"like a USB-C port for AI applications\".)</li>\n</ul>", "path": "raw/06-anthropic-mcp-announcement.md"}, "schema": {"title": "Schema（CLAUDE.md）", "meta": "Wiki 的規則：三層結構、頁面格式、ingest / query / lint 流程", "html": "<h1>Schema：AI Agents LLM Wiki</h1>\n<p>這份檔案是 Wiki 的「憲法」（Karpathy LLM Wiki 的第三層 schema）。\n人與 LLM 一起維護它；LLM 每次 ingest / query / lint 前都要先讀這份檔案。</p>\n<h2>三層結構</h2>\n<table>\n<thead>\n<tr>\n<th>層</th>\n<th>路徑</th>\n<th>誰寫</th>\n<th>規則</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Raw sources</td>\n<td><code>raw/</code></td>\n<td>人挑選、工具擷取</td>\n<td><strong>不可修改</strong>。每份檔頭記錄 URL、取得日期、取得方式</td>\n</tr>\n<tr>\n<td>Wiki</td>\n<td><code>wiki/</code></td>\n<td>LLM</td>\n<td>人讀、LLM 寫；所有事實句必須能追溯到 raw</td>\n</tr>\n<tr>\n<td>Schema</td>\n<td><code>CLAUDE.md</code></td>\n<td>人 + LLM</td>\n<td>規則改了要在 <code>wiki/log.md</code> 記一筆</td>\n</tr>\n</tbody>\n</table>\n<h2>頁面類型與命名</h2>\n<ul>\n<li><code>wiki/sources/&lt;slug&gt;.md</code>：一篇 raw 對應一頁來源摘要</li>\n<li><code>wiki/concepts/&lt;slug&gt;.md</code>：概念頁（一個概念一頁）</li>\n<li><code>wiki/comparisons/&lt;slug&gt;.md</code>：跨來源比較、矛盾整理</li>\n<li><code>wiki/analyses/&lt;slug&gt;.md</code>：query 產生、值得保存的答案（回存）</li>\n<li><code>wiki/overview.md</code>：全主題總覽；<code>wiki/index.md</code>：目錄；<code>wiki/log.md</code>：只能 append 的日誌</li>\n<li>檔名一律小寫英文、連字號分隔</li>\n</ul>\n<h2>每頁必備 frontmatter</h2>\n<pre><code class=\"language-yaml\">---\ntitle: 中文標題\ntype: source | concept | comparison | analysis | overview\nsources: [raw 檔名, ...]      # concept/comparison/analysis 至少 1 個\nupdated: YYYY-MM-DD\n---\n</code></pre>\n<ul>\n<li>內文的事實句後面用 <code>〔raw:檔名〕</code> 標註來源</li>\n<li>LLM 自己加的比喻或說明必須標 <code>〔註解〕</code>，<strong>不可</strong>冒用〔raw:〕（2026-11-15 新增，見 log）</li>\n<li>引用核對：標了〔raw:XX〕的句子中，英文術語與數字必須真的出現在 raw/XX（lint 自動檢查）</li>\n<li>頁面互連用 <code>[[slug]]</code>（不含資料夾），每個概念頁至少連出 1 個、被連入 1 個</li>\n<li>來源之間說法不一致時，<strong>不要自己選邊</strong>：在頁面加「⚠️ 來源差異」段落，並在 comparisons 建頁</li>\n</ul>\n<h2>操作流程</h2>\n<h3>Ingest（一次一篇，先討論、後生成）</h3>\n<ol>\n<li>讀 raw → 2. 在對話中列出 3–5 個重點與人確認 → 3. 寫 source 頁</li>\n<li>更新/新增相關 concept 頁 → 5. 更新 index.md → 6. 在 log.md append</li>\n<li>跑 <code>python3 tools/lint.py --ingest</code>（尚未建立的連結只算 warning），有 error 就修到 0 才算完成</li>\n<li>人工引用抽查：隨機挑 3 句，回 raw 確認意思一致（lint 只能核對英文術語與數字，中文的意思要靠人工）</li>\n<li>全部 ingest 完後跑 <code>python3 tools/lint.py</code>（嚴格模式：斷連結也算 error）</li>\n</ol>\n<h3>Query</h3>\n<ol>\n<li>先讀 <code>index.md</code> 找頁面 → 2. 讀相關頁 → 3. 合成答案並引用 <code>[[slug]]</code></li>\n<li>答案有保存價值就回存到 <code>wiki/analyses/</code></li>\n</ol>\n<h3>Lint（自動 + 人工）</h3>\n<p>自動（tools/lint.py）：frontmatter 完整、sources 指向存在的 raw、<code>[[連結]]</code> 不斷、無孤兒頁、index 涵蓋所有頁、每個事實段落有〔raw:〕標註。\n人工：矛盾、過時說法、缺少的概念頁。</p>\n<h2>簡報產生規則（Query 的一種輸出）</h2>\n<ul>\n<li>簡報只能用 Wiki 內容，不可直接讀 raw、不可用模型記憶補內容</li>\n<li>每張投影片標記 <code>data-wiki=\"slug,slug\"</code>，由 <code>tools/check_slides.py</code> 檢查</li>\n<li>觀眾：修過 AI 入門課的同學（可用 LLM、prompt、API 等名詞，不必解釋）</li>\n</ul>", "path": "CLAUDE.md"}}, GROUPS={"總覽": ["index", "overview"], "概念": ["agency-spectrum", "agent-challenges", "agent-loop", "augmented-llm", "guardrails-and-oversight", "mcp", "memory", "multi-agent-orchestration", "planning", "tools-and-aci", "what-is-an-agent", "when-to-use-agents", "workflow-patterns", "workflow-vs-agent"], "比較": ["agent-definitions-compared", "source-discrepancies"], "來源摘要": ["src-anthropic-effective-agents", "src-anthropic-mcp", "src-hf-what-is-an-agent", "src-openai-practical-guide", "src-react-paper", "src-weng-autonomous-agents"], "原始資料 raw": ["raw-00", "raw-01", "raw-02", "raw-03", "raw-04", "raw-05", "raw-06"], "規則與紀錄": ["schema", "log"]};
const toc=document.getElementById('toc');
function buildToc(filter=''){
  toc.innerHTML='';const f=filter.trim().toLowerCase();
  for(const [g,slugs] of Object.entries(GROUPS)){
    const hits=slugs.filter(s=>!f||PAGES[s].title.toLowerCase().includes(f)||s.includes(f)||PAGES[s].html.toLowerCase().includes(f));
    if(!hits.length)continue;
    const h=document.createElement('h4');h.textContent=g;toc.appendChild(h);
    hits.forEach(s=>{const a=document.createElement('a');a.href='#'+s;a.textContent=PAGES[s].title.replace(/^來源摘要｜/,'');a.dataset.s=s;toc.appendChild(a);});
  }
  mark();
}
function mark(){const cur=(location.hash.slice(1)||'index');toc.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.s===cur));}
function show(){
  const s=location.hash.slice(1)||'index';const p=PAGES[s]||PAGES['index'];
  document.getElementById('path').textContent=p.path;
  document.getElementById('title').textContent=p.title;
  document.getElementById('meta').textContent=p.meta||'';
  document.getElementById('body').innerHTML=p.html;
  const back=Object.entries(PAGES).filter(([k,v])=>k!==s&&k!=='index'&&v.html.includes('href="#'+s+'"')).map(([k,v])=>`<a class="wl" href="#${k}">${k}</a>`);
  document.getElementById('backlinks').innerHTML=back.length?'連到這一頁的頁面：'+back.join('、'):'';
  mark();window.scrollTo(0,0);
}
document.getElementById('q').addEventListener('input',e=>buildToc(e.target.value));
addEventListener('hashchange',show);buildToc();show();
</script>
</body>
</html>
